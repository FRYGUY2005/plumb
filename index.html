<html lang="en">
<head>

<title>Plumb · the daily dive</title>

<style>
:root{--sky:#bfeaf2;--txt:#e9f6fb;--mute:#8fb0c2;--acc:#6fd0e8;--panel:rgba(4,12,26,.74);--line:rgba(130,205,235,.22);--dim:0;--ray:1;--sh:6px;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky:#0a1a2c;color-scheme:dark}}
:root[data-theme="dark"]{--sky:#0a1a2c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--sky);color:var(--txt);font:17px/1.4 "Outfit",system-ui,sans-serif;overflow-x:hidden}
#world{position:fixed;inset:0;overflow:hidden;background:var(--sky);z-index:0}
.strip{position:absolute;left:0;right:0;top:30vh;height:3600px;background:linear-gradient(#46d3e3 0,#1b88b2 80px,#0d4a7a 400px,#071d3a 1600px,#040b18 2400px,#02050c 2800px);transition:transform 1.7s cubic-bezier(.55,0,.25,1)}
.strip>i{position:absolute;width:6px;height:6px;border-radius:50%;opacity:.85}
.rays{position:fixed;left:0;right:0;top:0;height:70vh;z-index:0;pointer-events:none;background:repeating-linear-gradient(105deg,rgba(255,255,255,.16) 0 26px,transparent 26px 96px);-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent);opacity:var(--ray);transition:opacity 1.7s}
.snow{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(circle,rgba(220,245,255,.55) 1.2px,transparent 1.8px),radial-gradient(circle,rgba(220,245,255,.35) 1px,transparent 1.6px);background-size:140px 170px,90px 110px;animation:sn 24s linear infinite;opacity:.55}
@keyframes sn{to{background-position:0 -680px,30px -440px}}
.vig{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(circle at 50% 30vh,transparent 70px,rgba(0,2,8,.94) 400px);opacity:calc(.05 + var(--dim)*.95);transition:opacity 1.7s}
.diver{position:fixed;left:calc(50% - 30px);top:calc(30vh - 18px);width:60px;height:36px;z-index:2;filter:drop-shadow(0 0 14px rgba(150,230,255,.8));animation:bob 3.4s ease-in-out infinite}
.diver svg{width:100%;height:100%;display:block}
.diver.pulse{animation:pu .6s ease-out}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes pu{40%{transform:scale(1.5)}}
.gauge{position:fixed;right:10px;top:84px;height:42vh;width:4px;background:rgba(255,255,255,.18);border-radius:3px;z-index:3}
.gauge i{position:absolute;left:-4px;width:12px;height:12px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc);top:0;transition:top 1.7s cubic-bezier(.55,0,.25,1)}
.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:16px;right:30px;max-width:560px;margin:0 auto;z-index:3;display:flex;justify-content:space-between;align-items:flex-start;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.mark{font-weight:300;letter-spacing:.32em;font-size:15px;opacity:.9}
.dep{text-align:right;font-variant-numeric:tabular-nums}
.dep b{display:block;font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:34px;line-height:1}
.dep span{font-size:13px;opacity:.8;letter-spacing:.06em}
main{position:relative;z-index:3;max-width:520px;margin:0 auto;padding:calc(30vh + 44px) 16px 40px}
.panel{background:var(--panel);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;padding:22px 20px 18px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
h1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:46px;line-height:1;margin:0 0 6px;letter-spacing:.01em;color:#fff}
h2{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:29px;line-height:1.15;margin:0 0 14px;color:#fff}
p{margin:0 0 12px}
.sm{font-size:14px;color:var(--mute)}
.q{font-family:"Instrument Serif",Georgia,serif;font-style:italic;color:var(--acc)}
button{font:inherit;font-weight:400;color:#fff;background:rgba(111,208,232,.14);border:1px solid var(--line);padding:10px 20px;border-radius:999px;cursor:pointer;transition:background .15s}
button:hover,button:focus-visible{background:rgba(111,208,232,.3);outline:2px solid var(--acc);outline-offset:2px}
button.pri{background:var(--acc);color:#03121c;font-weight:600;border-color:transparent}
button.pri:hover,button.pri:focus-visible{background:#9be3f3}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 4px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.grid button{text-align:left;border-radius:14px;padding:11px 14px}
input{width:100%;font:inherit;font-size:21px;padding:12px 16px;background:rgba(0,8,18,.6);color:#fff;border:1px solid var(--line);border-radius:14px}
input::placeholder{color:#58798c}
input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hint{min-height:24px;font-size:15px;color:var(--acc);margin:8px 4px 0}.hint b{color:#fff;cursor:pointer;text-decoration:underline;font-weight:400}
.clock{height:4px;background:rgba(255,255,255,.14);border-radius:3px;margin:2px 0 16px;overflow:hidden}
.clock i{display:block;height:100%;background:var(--acc);width:100%}
.res{margin:0 0 14px;padding:12px 14px;background:rgba(0,10,22,.55);border-left:4px solid;border-radius:12px;animation:rin .4s ease-out;transition:opacity 1s}
.res.fade{opacity:0}
.res .t{font-family:"Instrument Serif",Georgia,serif;font-size:27px;line-height:1.1}
.res .t small{font-family:"Outfit",sans-serif;font-size:14px;color:var(--mute);margin-left:8px}
@keyframes rin{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
.rar{display:flex;gap:4px;margin:8px 0}.rar i{width:26px;height:6px;border-radius:3px;background:rgba(255,255,255,.14)}
.you{color:#fff;font-size:19px}.you.x{text-decoration:line-through;text-decoration-color:#ff7a7a;color:var(--mute)}
.fact{margin:0 0 14px;padding:11px 14px;background:rgba(111,208,232,.09);border-radius:12px;font-size:15px;color:#cfeaf4;animation:rin .4s ease-out}
.fact b{color:var(--acc);font-weight:600;margin-right:8px;font-variant-numeric:tabular-nums}
.tiers{margin:12px 0 0;padding:0;list-style:none;font-size:15px}
.tiers li{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.load{padding:26px 0;text-align:center;font-family:"Instrument Serif",Georgia,serif;font-size:30px;color:var(--acc)}
.load span{animation:bl 1.4s infinite}@keyframes bl{50%{opacity:.2}}
.big{font-family:"Instrument Serif",Georgia,serif;font-size:76px;line-height:1;color:#fff;margin:2px 0}
.pips{font-size:26px;letter-spacing:4px;margin:6px 0}
#flash{position:fixed;inset:0;opacity:0;pointer-events:none;z-index:4}
#flash.go{animation:fl .9s ease-out}
@keyframes fl{0%{opacity:var(--fo)}100%{opacity:0}}
.ring{position:fixed;left:calc(50% - 20px);top:calc(30vh - 20px);width:40px;height:40px;border:3px solid;border-radius:50%;opacity:0;pointer-events:none;z-index:4}
.ring.go{animation:rg 1.2s ease-out}
@keyframes rg{0%{opacity:.9;transform:scale(1)}100%{opacity:0;transform:scale(22)}}
body.shake #world,body.shake main{animation:sk .5s linear}
@keyframes sk{0%,100%{transform:none}15%{transform:translate(var(--sh),calc(var(--sh)*-.6))}35%{transform:translate(calc(var(--sh)*-1),calc(var(--sh)*.6))}55%{transform:translate(calc(var(--sh)*.6),var(--sh))}75%{transform:translate(calc(var(--sh)*-.5),calc(var(--sh)*-.4))}}
.strip.glitch{animation:gl 1.2s ease-in-out}
@keyframes gl{50%{filter:hue-rotate(70deg) brightness(1.7) saturate(1.6)}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:5}
.snd{margin-left:8px;padding:1px 8px;font-size:14px;border-radius:999px;line-height:1.4;vertical-align:middle;background:rgba(255,255,255,.14)}

 <input id="in" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="type an answer" aria-label="Your answer">
 <div class="hint" id="hint"></div><div class="row"><button class="pri" id="ok">Dive</button></div>`;
 const inp=$("in"),h=$("hint");inp.focus({preventScroll:true});$("ok").onclick=()=>fin(inp.value);
 const take=()=>{if(sg){inp.value=sg.d;sg=null;h.textContent="";inp.focus()}};
 inp.oninput=()=>{SND.key();sg=suggest(es,inp.value);h.innerHTML=sg?`Did you mean <b id="sg">${esc(sg.d)}</b>? Press Tab or tap it.`:"";if(sg)$("sg").onclick=take};
 inp.onkeydown=e=>{if(e.key==="Enter")fin(inp.value);else if(e.key==="Tab"&&sg){e.preventDefault();take()}};
 let lastT=0;const t0=Date.now();clearInterval(tm);
 tm=setInterval(()=>{const r=1-(Date.now()-t0)/LIM;$("ck").style.width=Math.max(0,r*100)+"%";const sc=Math.ceil(r*25);if(sc<=5&&sc>0&&sc!==lastT){lastT=sc;SND.tick()}if(r<=0)fin(inp.value,true)},100)}
async function fin(v,force){if(st!=="ask")return;
 const p=g.cur,typed=v.trim();let r=find(p.e,v),e=r&&r.e;
 if(!e&&!force){$("hint").innerHTML=typed?`“${esc(typed)}” isn’t in the answer set. Try another.`:"Type an answer first.";if(typed)SND.tier(-1);const i=$("in");i.focus();i.select();return}
 st="rev";clearInterval(tm);markPlayed(p.q);

 const t=e?e.t:-1,old=g.score;g.res.push(t);if(e)g.score+=PTS[t];
 const hi=p.e.filter(x=>x.t>=4).map(x=>x.d).slice(0,3),lo=p.e.filter(x=>x.t===0).map(x=>x.d).slice(0,3),col=e?TIERS[t][1]:"#8a9aa8";
 const fix=!e?"":r.derived?` Counted as a kind of ${esc(r.derived)}, one tier up.`:r.fixed?` Autocorrected to ${esc(e.d)}.`:nz(e.d)!==nz(typed)?` Counted as ${esc(e.d)}.`:"";
 clearTimeout(rt);$("res").innerHTML=`<div class="res" style="border-color:${col}"><div class="t" style="color:${col}">${e?TIERS[t][0]:"Not on the list"}<small>${e?"+"+PTS[t]+" pts · +"+PTS[t]*10+" m":"+0"}</small></div><div class="rar" aria-hidden="true">${TIERS.map((x,i)=>`<i style="${i<=t?"background:"+x[1]:""}"></i>`).join("")}</div><div class="you${e?"":" x"}">${typed?esc(typed):"(no answer)"}</div><div class="sm">${e?DESC[t]:"That one isn’t in the answer set."}${fix}${hi.length&&t<4?" Deep cuts: "+hi.map(esc).join(", ")+".":""}${lo.length?" Everyone says: "+lo.map(esc).join(", ")+".":""}</div></div>`;
 rt=setTimeout(()=>{const x=$("res");x&&x.firstChild&&x.firstChild.classList.add("fade")},7000);
 effects(t);SND.tier(t);SND.whoosh(g.score*10);ambient(true,g.score*10);descend(old,g.score);showFact(old,g.score);
 g.i++;if(g.i<7)ask();else{$("q").innerHTML="";setTimeout(end,3300)}}
const RK=[[700,"Leviathan"],[600,"Trench pioneer"],[450,"Deep-sea explorer"],[300,"Submariner"],[150,"Scuba diver"],[0,"Snorkeler"]];
function end(){st="end";SND.end(g.score);ambient(false);const m=g.score*10,r=RK.find(x=>g.score>=x[0]),pips=g.res.map(t=>t<0?"▫️":TIERS[t][2]).join("");
 if(g.daily===dk(new Date())&&!best("plumb-day-"+g.daily))best("plumb-day-"+g.daily,{s:g.score,p:pips});else if(g.daily&&!best("plumb-day-"+g.daily))best("plumb-day-"+g.daily,{s:g.score,p:pips});
 const sh="Plumb · rare answers sink you deeper\n"+pips+"\n"+fm(m)+" · "+zone(m)+" · "+r[1];
 app.innerHTML=`<p class="sm">${zone(m)}</p><div class="big">${m.toLocaleString("en-US")}<span style="font-size:30px"> m</span></div><h2>${r[1]}</h2><div class="pips" aria-hidden="true">${pips}</div>
 <p class="sm">${g.score} of 700 points.</p><div class="row"><button class="pri" id="sh">Copy result</button><button id="ag">Unlimited</button><button id="hm">Home</button></div>`;
 $("ag").onclick=()=>go({pack:g.o.pack||null});$("hm").onclick=home;
 $("sh").onclick=async()=>{try{await navigator.clipboard.writeText(sh);$("sh").textContent="Copied"}catch(e){$("sh").textContent="Copy failed"}}}
home();
</script>
