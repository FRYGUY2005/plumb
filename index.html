<!DOCTYPE html>
<html lang="en">
<head>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}

.rays{position:fixed;left:0;right:0;top:0;height:70vh;z-index:0;pointer-events:none;background:repeating-linear-gradient(105deg,rgba(255,255,255,.16) 0 26px,transparent 26px 96px);-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent);opacity:var(--ray);transition:opacity 1.7s}
.snow{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(circle,rgba(220,245,255,.55) 1.2px,transparent 1.8px),radial-gradient(circle,rgba(220,245,255,.35) 1px,transparent 1.6px);background-size:140px 170px,90px 110px;animation:sn 24s linear infinite;opacity:.55}

const bankPrompt=q=>`You are building the curated answer set for a rare-answer trivia game. Players type one answer to the prompt and score more for answers that fewer people think of.
Prompt: "${q}"
List 80 to 110 distinct answers that fully satisfy the exact wording of the prompt, all strictly accurate, spanning the whole range from famous to obscure. For each give n (canonical name), a (array of up to 3 alternate spellings, aliases or short forms, may be empty) and t (familiarity tier):

1 = too clever: the predictable "obscure" pick that many trivia fans reach for (3 to 6 answers)

4 = deep cut, specialist knowledge but unmistakably valid (20 to 30 answers)
