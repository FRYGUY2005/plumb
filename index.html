<html lang="en">
<head>

<style>
:root{--sky:#bfeaf2;--txt:#e9f6fb;--mute:#8fb0c2;--acc:#6fd0e8;--panel:rgba(4,12,26,.74);--line:rgba(130,205,235,.22);--dim:0;--ray:1;--sh:6px;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky:#0a1a2c;color-scheme:dark}}
:root[data-theme="dark"]{--sky:#0a1a2c;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--sky);color:var(--txt);font:17px/1.4 "Outfit",system-ui,sans-serif;overflow-x:hidden}
#world{position:fixed;inset:0;overflow:hidden;background:var(--sky);z-index:0}
.strip{position:absolute;left:0;right:0;top:30vh;height:3600px;background:linear-gradient(#63e3ee 0,#2fb0d2 50px,#1b88b2 120px,#136aa0 260px,#0d4a7a 420px,#0a3560 800px,#071d3a 1600px,#050f24 2100px,#040b18 2400px,#02050c 2800px);transition:transform 1.7s cubic-bezier(.55,0,.25,1)}
.strip>i{position:absolute;width:6px;height:6px;border-radius:50%;opacity:.85}
.rays{position:fixed;left:0;right:0;top:0;height:70vh;z-index:0;pointer-events:none;background:repeating-linear-gradient(105deg,rgba(255,255,255,.16) 0 26px,transparent 26px 96px);-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent);opacity:var(--ray);transition:opacity 1.7s}
.snow{position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(circle,rgba(220,245,255,.55) 1.2px,transparent 1.8px),radial-gradient(circle,rgba(220,245,255,.35) 1px,transparent 1.6px);background-size:140px 170px,90px 110px;animation:sn 24s linear infinite;opacity:.55}
@keyframes sn{to{background-position:0 -680px,30px -440px}}
.vig{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(circle at 50% 30vh,transparent 70px,rgba(0,2,8,.94) 400px);opacity:calc(.05 + var(--dim)*.95);transition:opacity 1.7s}
.diver{position:fixed;left:calc(50% - 30px);top:calc(30vh - 18px);width:60px;height:36px;z-index:2;filter:drop-shadow(0 0 14px rgba(150,230,255,.8));animation:bob 3.4s ease-in-out infinite}
.diver svg{width:100%;height:100%;display:block}
.diver.pulse{animation:pu .6s ease-out}
@keyframes bob{50%{transform:translateY(-6px)}}

.gauge{position:fixed;right:10px;top:84px;height:42vh;width:4px;background:rgba(255,255,255,.18);border-radius:3px;z-index:3}
.gauge i{position:absolute;left:-4px;width:12px;height:12px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc);top:0;transition:top 1.7s cubic-bezier(.55,0,.25,1)}
.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:16px;right:30px;max-width:560px;margin:0 auto;z-index:3;display:flex;justify-content:space-between;align-items:flex-start;color:#fff;text-shadow:0 1px 8px rgba(0,0,0,.5)}
.mark{font-weight:300;letter-spacing:.32em;font-size:15px;opacity:.9}
.dep{text-align:right;font-variant-numeric:tabular-nums}
.dep b{display:block;font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:34px;line-height:1}
.dep span{font-size:13px;opacity:.8;letter-spacing:.06em}
main{position:relative;z-index:3;max-width:520px;margin:0 auto;padding:calc(30vh + 44px) 16px 40px}
.panel{background:var(--panel);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:20px;padding:22px 20px 18px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
h1{font-family:"Instrument Serif",Georgia,serif;font-weight:400;font-size:46px;line-height:1;margin:0 0 6px;letter-spacing:.01em;color:#fff}

p{margin:0 0 12px}
.sm{font-size:14px;color:var(--mute)}
.q{font-family:"Instrument Serif",Georgia,serif;font-style:italic;color:var(--acc)}
button{font:inherit;font-weight:400;color:#fff;background:rgba(111,208,232,.14);border:1px solid var(--line);padding:10px 20px;border-radius:999px;cursor:pointer;transition:background .15s}
button:hover,button:focus-visible{background:rgba(111,208,232,.3);outline:2px solid var(--acc);outline-offset:2px}
button.pri{background:var(--acc);color:#03121c;font-weight:600;border-color:transparent}

.hint{min-height:24px;font-size:15px;color:var(--acc);margin:8px 4px 0}.hint b{color:#fff;cursor:pointer;text-decoration:underline;font-weight:400}

.res{margin:0 0 14px;padding:12px 14px;background:rgba(0,10,22,.55);border-left:4px solid;border-radius:12px;animation:rin .4s ease-out;transition:opacity 1s}

.pips{font-size:26px;letter-spacing:4px;margin:6px 0}

.ring.go{animation:rg 1.2s ease-out}

.cr{position:absolute;left:0;width:var(--w,50px);height:calc(var(--w,50px)*var(--a,.6));color:var(--c,#cfeaf5);opacity:var(--o,.7);transform:translateX(var(--sx,0));animation:swim var(--d,60s) linear var(--dl,0s) infinite;will-change:transform;pointer-events:none}
.cr.rv{animation-name:swimr}
.cr svg{width:100%;height:100%;display:block;overflow:visible;transform:scaleX(var(--f,1));animation:bobc var(--b,6s) ease-in-out infinite}
.cr.jf svg{animation:jfp 3.2s ease-in-out infinite}
.cr.glow svg{filter:drop-shadow(0 0 7px var(--g,#35e0c0))}
@keyframes swim{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
@keyframes swimr{from{transform:translateX(130vw)}to{transform:translateX(-30vw)}}
@keyframes bobc{50%{transform:translateY(-9px) scaleX(var(--f,1))}}
@keyframes jfp{0%,100%{transform:scale(1,1)}50%{transform:scale(1.08,.86) translateY(-6px)}}
.bb{position:absolute;bottom:-24px;left:var(--x,50%);width:var(--s,5px);height:var(--s,5px);border:1.5px solid rgba(225,247,255,.55);border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.35),transparent 60%);animation:rise var(--d,14s) linear var(--dl,0s) infinite;pointer-events:none}
@keyframes rise{0%{transform:translate(0,0);opacity:0}8%{opacity:.8}50%{transform:translate(14px,-55vh)}100%{transform:translate(-8px,-115vh);opacity:0}}
.vy{position:absolute;width:15px;height:15px;z-index:2;opacity:.4;cursor:default;pointer-events:auto;filter:drop-shadow(0 0 5px rgba(255,210,31,.75));animation:vyb 9s ease-in-out infinite}
.vy::after{content:"";position:absolute;inset:-12px;border-radius:50%}
.vy svg{width:100%;height:100%;display:block}
.vy .e{transform-box:fill-box;transform-origin:center;animation:blink 6s infinite}
@keyframes vyb{0%,100%{transform:translate(0,0)}50%{transform:translate(22px,-12px)}}
main{pointer-events:none}.panel{pointer-events:auto}.hud{pointer-events:none}.snd{pointer-events:auto}
@media (prefers-reduced-motion:reduce){.cr,.cr svg,.cr.jf svg,.bb,.caus,.strip::before,.vy{animation:none}.cr{transform:translateX(var(--sx,0))}}

</style>

function boot(Q){const POOL=Q.POOL,BUILTIN=Q.IDS,G=Q.G||{};

const PTS=[10,15,30,60,85,100];
const TIERS=[["Barnacle","#9fb4c0","⬜"],["Smartfish","#d4e36a","🟨"],["Mackerel","#6fd0e8","🟦"],["Anglerfish","#35e0c0","🟩"],["Giant Squid","#c070ff","🟪"],["Leviathan","#ffe08a","🟧"]];

const FACTS=[[0,"Pressure rises by about one atmosphere for every 10 meters you descend."],[40,"Recreational scuba diving is capped at around 40 meters."],[200,"Below about 200 meters, sunlight is nearly gone. The twilight zone begins."],[332,"The deepest scuba dive on record is about 332 meters, set in 2014."],[600,"Many animals in the open ocean make their own light below 200 meters. It is called bioluminescence."],[1000,"No sunlight reaches below about 1,000 meters. Down here the only light is made by living things."],[1500,"Elephant seals can dive deeper than 1,500 meters on a single breath."],[2500,"Hydrothermal vents were first seen in 1977 near the Galápagos, at about 2,500 meters."],[2992,"Cuvier’s beaked whales hold the mammal dive record, at about 2,992 meters."],[3700,"The average depth of the ocean is about 3,700 meters."],[3800,"The wreck of the Titanic lies at about 3,800 meters."],[4000,"The abyssal zone begins here, where the water sits near freezing."],[4500,"Marine snow, drifting bits of dead plankton and waste, takes weeks to sink this far."],[5000,"At 5,000 meters the pressure is roughly 500 times what it is at the surface."],[5500,"In some species of anglerfish, the tiny male permanently fuses to the female."],[6000,"The hadal zone is named for Hades. It starts at 6,000 meters and is found mostly in trenches."],[6900,"In 2022 a snailfish was filmed at about 8,336 meters in the Izu-Ogasawara Trench, deeper than any fish seen before."],[7000,"The Mariana Trench’s Challenger Deep is about 10,935 meters deep, nearly four kilometers beyond this."]];

 for(let i=1;i<=m;i++)for(let j=1;j<=n;j++){d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));if(i>1&&j>1&&a[i-1]===b[j-2]&&a[i-2]===b[j-1])d[i][j]=Math.min(d[i][j],d[i-2][j-2]+1)}return d[m][n]}

function idx(es){if(es._i)return es._i;const ex=new Map(),st=new Map(),list=[];for(const e of es)for(const al of e.a){const m=nz(al);if(!m)continue;if(!ex.has(m))ex.set(m,e);const s=strip(m);if(!st.has(s))st.set(s,e);list.push([s,m,e])}return es._i={ex,st,list}}

 const a=await lim(()=>SM.json(`Invent 7 different open-ended prompts for a rare-answer trivia game. Theme (strict): ${pack}. Every prompt must clearly belong to this one theme and no other. Each is a short imperative like "Name a ..." with a precise boundary so anything that fits is valid, and each must have at least 150 valid answers ranging from famous to obscure. Vary the sub-topics widely, taking loose inspiration from these random words: ${seeds}. Do not repeat or closely resemble: ${used.join(" / ")||"nothing yet"}. Output ONLY a JSON array of 7 strings.`,{modelTier:"quick",cache:false}));
 const o=(Array.isArray(a)?a:a&&a.prompts||[]).filter(x=>typeof x==="string"&&x.length>10&&x.length<110);if(o.length<7)throw{code:"thin"};
 try{localStorage.setItem("plumb-recent",JSON.stringify(recent().concat(o).slice(-80)))}catch(e){}return o.slice(0,7)}
async function judge(q,es,v){const ex=shuf(es,Math.random).slice(0,14).map(e=>e.t+": "+e.d).join("; ");
 const r=await withTimeout(lim(()=>SM.json(`Rare-answer trivia. Prompt: "${q}"
Player answer: "${v}"
Decide strictly whether this is a real, correct answer to the prompt (accept reasonable spelling variants, reject anything that does not satisfy the exact wording). If valid, give its canonical name and a familiarity tier 0-5 (0 nearly everyone says it first, 1 the predictable "clever" pick, 2 beyond the first thought, 3 rare, 4 deep cut for specialists, 5 astonishingly obscure but verifiable). Calibration examples (tier: answer): ${ex}.
Output ONLY JSON: {"valid":true,"n":"canonical name","t":2} or {"valid":false}`,{modelTier:"quick",cache:false})),14000);
 if(!r||!r.valid||typeof r.n!=="string")return null;const n=r.n.replace(/[;|]/g," ").slice(0,60);return{t:Math.max(0,Math.min(5,r.t|0)),d:n,a:[n,v]}}
function pickSet(r,only,avoid){const bad=new Set(avoid||[]),ub=new Set(),out=[],keys=Object.keys(POOL),bo=q=>G[q]||(DER[q]?DER[q].b:q),ok=q=>avail(q)&&!bad.has(q);
 const wt=a=>a.map(x=>[r()*(G[x]?1:.12),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
 const packs=only?[only]:shuf(keys,r),pool=packs.map(k=>wt(POOL[k].filter(ok)));
 let i=0,guard=0;while(out.length<7&&pool.some(a=>a.length)&&guard++<20000){const a=pool[i++%pool.length],x=a.shift();if(x&&!ub.has(bo(x))){ub.add(bo(x));out.push(x)}}
 if(out.length<7){for(const k of only?[only]:shuf(keys,r))for(const x of wt(POOL[k].filter(avail))){if(out.length<7&&!ub.has(bo(x))){ub.add(bo(x));out.push(x)}}}
 if(out.length<7){for(const k of shuf(keys,r))for(const x of wt(POOL[k].filter(avail))){if(out.length<7&&!ub.has(bo(x))){ub.add(bo(x));out.push(x)}}}
 return out}
function best(key,v){try{if(v!==undefined)localStorage.setItem(key,JSON.stringify(v));const s=localStorage.getItem(key);return s?JSON.parse(s):null}catch(e){return null}}
function home(){ambient(false);st="home";clearInterval(tm);g=null;meter();place(0,true);const k=dk(new Date()),d=best("plumb-day-"+k);
 app.innerHTML=`<h1>Plumb</h1><p class="q">rare answers sink you deeper.</p>
 <p>Seven prompts, 25 seconds each. Every prompt has hundreds of right answers, but the obvious ones barely move you. Find the ones almost nobody thinks of and you sink toward the trench. 700 points is 7,000 meters.</p>
 ${d?`<p class="sm">Today’s dive: <b style="color:#fff">${fm(d.s*10)}</b> ${d.p}</p>`:""}
 <div class="row"><button class="pri" id="d">${d?"Replay today":"Daily dive"} · ${dlabel(new Date())}</button></div>
 <div class="row"><button id="u">∞ Unlimited</button><button id="a">Archive</button><button id="p">Themed packs</button></div>
 <ul class="tiers">${TIERS.map((t,i)=>`<li><span style="color:${t[1]}">${t[0]}</span><span>${PTS[i]} pts · ${PTS[i]*10} m</span></li>`).join("")}</ul>
 <p class="sm" style="margin-top:14px">Smartfish is the “too clever” tier: the go-to obscure pick that isn’t actually obscure. <span id="ai"></span> An unofficial fan-made game inspired by Krillion, not affiliated with it.</p>`;
 $("d").onclick=()=>go({daily:k});$("u").onclick=()=>go({pack:null});$("a").onclick=archive;$("p").onclick=packs;try{const vn=+localStorage.getItem("plumb-verity")||0;if(vn)app.insertAdjacentHTML("beforeend","<p class=\"sm\">Times you found Verity: "+vn+"</p>")}catch(e){}}
function packs(){st="menu";app.innerHTML=`<h2>Themed packs</h2><p class="sm">Unlimited dives in one subject.</p><div class="grid">${Object.keys(POOL).map(k=>`<button data-k="${esc(k)}">${esc(k)}</button>`).join("")}</div><div class="row"><button id="b">Back</button></div>`;
 app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>go({pack:b.dataset.k}));$("b").onclick=home}
function archive(){st="menu";const n=new Date();let h="";for(let i=1;i<=14;i++){const d=new Date(n);d.setDate(n.getDate()-i);const k=dk(d),r=best("plumb-day-"+k);h+=`<button data-d="${k}">${dlabel(d)}${r?" · "+fm(r.s*10):""}</button>`}
 app.innerHTML=`<h2>Archive</h2><p class="sm">Replay a past daily dive.</p><div class="grid">${h}</div><div class="row"><button id="b">Back</button></div>`;
 app.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>go({daily:+b.dataset.d}));$("b").onclick=home}
async function go(o){SND.start();placeVerity();st="load";g={qs:[],bp:[],i:0,score:0,res:[],seen:[],o,daily:o.daily||0};meter();place(0,true);
 app.innerHTML='<div class="load">descending<span>…</span></div>';
 try{
  if(o.daily){g.qs=pickSet(rng(o.daily))}
  else if(SM&&!noAI){try{g.qs=await genPrompts(o.pack||shuf(Object.keys(POOL),Math.random)[0])}catch(e){if(e&&e.code==="not_granted")noAI=true;g.qs=pickSet(Math.random,o.pack,played())}}
  else g.qs=pickSet(Math.random,o.pack,played());
 }catch(e){g.qs=pickSet(Math.random,o.pack,played())}
 app.innerHTML='<div id="res"></div><div id="fact"></div><div id="q"></div>';ask()}
function startBank(i){if(i>6||g.bp[i])return;const q=g.qs[i];g.bp[i]=getBank(q).catch(e=>{if(e&&e.code==="not_granted")noAI=true;const alt=shuf(Object.keys(BUILTIN).filter(x=>!g.qs.includes(x)),Math.random)[0]||Object.keys(BUILTIN)[0];g.qs[i]=alt;return loadBank(alt)}).then(b=>{g.bp[i].ok=1;return b})}
async function ask(){st="load";const i=g.i;startBank(i);startBank(i+1);
 if(!g.bp[i].ok)$("q").innerHTML=`<p class="sm">Prompt ${i+1} of 7</p><div class="load">descending<span>…</span></div>`;
 let es;try{es=await g.bp[i]}catch(e){$("q").innerHTML='<p>Couldn\u2019t load this question set. Check your connection and try again.</p><div class="row"><button class="pri" id="rt">Back to menu</button></div>';$("rt").onclick=home;return}
 g.cur={q:g.qs[i],e:es};st="ask";sg=null;
 $("q").innerHTML=`<p class="sm">Prompt ${i+1} of 7</p><div class="clock"><i id="ck"></i></div><h2>${esc(g.cur.q)}</h2>
 <input id="in" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="type an answer" aria-label="Your answer">
 <div class="hint" id="hint"></div><div class="row"><button class="pri" id="ok">Dive</button></div>`;
 const inp=$("in"),h=$("hint");inp.focus({preventScroll:true});$("ok").onclick=()=>fin(inp.value);
 const take=()=>{if(sg){inp.value=sg.d;sg=null;h.textContent="";inp.focus()}};
 inp.oninput=()=>{SND.key();sg=suggest(es,inp.value);h.innerHTML=sg?`Did you mean <b id="sg">${esc(sg.d)}</b>? Press Tab or tap it.`:"";if(sg)$("sg").onclick=take};
 inp.onkeydown=e=>{if(e.key==="Enter")fin(inp.value);else if(e.key==="Tab"&&sg){e.preventDefault();take()}};
 let lastT=0;const t0=Date.now();clearInterval(tm);
 tm=setInterval(()=>{const r=1-(Date.now()-t0)/LIM;$("ck").style.width=Math.max(0,r*100)+"%";const sc=Math.ceil(r*25);if(sc<=5&&sc>0&&sc!==lastT){lastT=sc;SND.tick()}if(r<=0)fin(inp.value,true)},100)}
async function fin(v,force){if(st!=="ask")return;
 const p=g.cur,typed=v.trim();let r=find(p.e,v),e=r&&r.e;
 if(!e&&!force){$("hint").innerHTML=typed?`“${esc(typed)}” isn’t in the answer set. Try another.`:"Type an answer first.";if(typed)SND.tier(-1);const i=$("in");i.focus();i.select();return}
 st="rev";clearInterval(tm);markPlayed(p.q);

 const t=e?e.t:-1,old=g.score;g.res.push(t);if(e)g.score+=PTS[t];
 const hi=p.e.filter(x=>x.t>=4).map(x=>x.d).slice(0,3),lo=p.e.filter(x=>x.t===0).map(x=>x.d).slice(0,3),col=e?TIERS[t][1]:"#8a9aa8";
 const fix=!e?"":r.derived?` Counted as a kind of ${esc(r.derived)}, one tier up.`:r.fixed?` Autocorrected to ${esc(e.d)}.`:nz(e.d)!==nz(typed)?` Counted as ${esc(e.d)}.`:"";
 clearTimeout(rt);$("res").innerHTML=`<div class="res" style="border-color:${col}"><div class="t" style="color:${col}">${e?TIERS[t][0]:"Not on the list"}<small>${e?"+"+PTS[t]+" pts · +"+PTS[t]*10+" m":"+0"}</small></div><div class="rar" aria-hidden="true">${TIERS.map((x,i)=>`<i style="${i<=t?"background:"+x[1]:""}"></i>`).join("")}</div><div class="you${e?"":" x"}">${typed?esc(typed):"(no answer)"}</div><div class="sm">${e?DESC[t]:"That one isn’t in the answer set."}${fix}${hi.length&&t<4?" Deep cuts: "+hi.map(esc).join(", ")+".":""}${lo.length?" Everyone says: "+lo.map(esc).join(", ")+".":""}</div></div>`;
 rt=setTimeout(()=>{const x=$("res");x&&x.firstChild&&x.firstChild.classList.add("fade")},7000);
 effects(t);SND.tier(t);SND.whoosh(g.score*10);ambient(true,g.score*10);descend(old,g.score);showFact(old,g.score);
 g.i++;if(g.i<7)ask();else{$("q").innerHTML="";setTimeout(end,3300)}}
const RK=[[700,"Leviathan"],[600,"Trench pioneer"],[450,"Deep-sea explorer"],[300,"Submariner"],[150,"Scuba diver"],[0,"Snorkeler"]];
function end(){st="end";SND.end(g.score);ambient(false);const m=g.score*10,r=RK.find(x=>g.score>=x[0]),pips=g.res.map(t=>t<0?"▫️":TIERS[t][2]).join("");
 if(g.daily===dk(new Date())&&!best("plumb-day-"+g.daily))best("plumb-day-"+g.daily,{s:g.score,p:pips});else if(g.daily&&!best("plumb-day-"+g.daily))best("plumb-day-"+g.daily,{s:g.score,p:pips});
 const sh="Plumb · rare answers sink you deeper\n"+pips+"\n"+fm(m)+" · "+zone(m)+" · "+r[1];
 app.innerHTML=`<p class="sm">${zone(m)}</p><div class="big">${m.toLocaleString("en-US")}<span style="font-size:30px"> m</span></div><h2>${r[1]}</h2><div class="pips" aria-hidden="true">${pips}</div>
 <p class="sm">${g.score} of 700 points.</p><div class="row"><button class="pri" id="sh">Copy result</button><button id="ag">Unlimited</button><button id="hm">Home</button></div>`;
 $("ag").onclick=()=>go({pack:g.o.pack||null});$("hm").onclick=home;
 $("sh").onclick=async()=>{try{await navigator.clipboard.writeText(sh);$("sh").textContent="Copied"}catch(e){$("sh").textContent="Copy failed"}}}
home();

}
</script>
